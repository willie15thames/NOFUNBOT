name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISCORD_TOKEN: test-token
      CLIENT_ID: '111111111111111111'
      GUILD_ID: '222222222222222222'
      AI_ENABLED: 'false'
      BOT_DATA_DIR: /tmp/nofunleague-ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: nofunleague
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/nofunleague?schema=public
      - run: npm run tsc
      - run: npm run release:verify
      - run: npm run prisma:migrate:deploy
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/nofunleague?schema=public
      - run: npm run schema:check && npm run test:postgres
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/nofunleague?schema=public
