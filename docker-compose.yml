services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nofunleague
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  bot:
    build: .
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    command: sh -c "npm run prisma:generate && npm run db:bootstrap && npm run db:migrate-json && npm run start"

  worker:
    build: .
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    command: sh -c "npm run prisma:generate && npm run queue:worker"

volumes:
  postgres_data:
  redis_data:
